- name: roboshop instance management
  hosts: local
  connection: local
  vars:
   instances: ["mongodb", "redis", "mysql", "rabbitmq", "frontend"]
   image_id: ami-0220d79f3f480ecf5
   domain: mokridevops.shop
   action: create
  tasks:
    - name: create ec2 instances 
      amazon.aws.ec2_instance:
        instance_type: t3.micro
        image_id: "{{ image_id }}"
        name: "roboshop-{{ item }}"
        security_groups: 
        - "roboshop-common"
        - "roboshop-{{ item }}"
      loop: "{{ instances }}"   
      register: ec2_instances_output
      when: action == "create"

    # - name: print out_put
    #   debug:
    #     msg: "{{ ec2_instances_output }}"

    # - name: create route53 records
    #   debug:
    #     msg: "Instance Name: {{ item.item }} Private IP: {{ item.instances[0].private_ip_address }}"
    #   loop: "{{ ec2_instances_output.results }}"


    - name: create route53 records
      amazon.aws.route53:
       state: present
       zone: "{{ domain }}"
       record:  "{{ item.item }}.{{ domain }}"   #mongodb.mokridevops.shop
       type: A
       ttl: 1
       value: "{{ item.instances[0].private_ip_address }}"
       overwrite: true
      loop:  "{{ ec2_instances_output.results }}"
      when: action == "create"
      # when: item.item != "frontend"

    - name: create route53 record for frontend
      amazon.aws.route53:
       state: present
       zone: "{{ domain }}"
       record:  "{{ domain }}"   #mokridevops.shop
       type: A
       ttl: 1
       value: "{{ item.instances[0].public_ip_address }}"
       overwrite: true
      loop:  "{{ ec2_instances_output.results }}"
      when: 
      - item.item == "frontend"
      - action == "create"


    - name: delete Route 53 records for frontend
      amazon.aws.route53:
       state: absent
       zone: "{{ domain }}"
       record:  "{{ domain }}"   #mokridevops.shop
       type: A
       ttl: 1
      loop:  "{{ instances}}"
      when: 
      - item == "frontend"
      - action == "delete"

    - name: delete Route 53 records
      amazon.aws.route53:
       state: absent
       zone: "{{ domain }}"
       record:  "{{ item }}.{{ domain }}"   #mokridevops.shop
       type: A
       ttl: 1
      loop:  "{{ instances}}"
      when: 
      - action == "delete"
      

    - name: delete EC2 instances
      amazon.aws.ec2_instance:
       state: absent
       name: "roboshop-{{ item }}"
      loop: "{{ instances }}"       
      when: action == "delete"

      