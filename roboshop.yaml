- name: roboshop instance management
  hosts: local
  connection: local
  vars:
   instances: ["mongodb", "redis", "mysql", "rabbitmq"]
   image_id: ami-0220d79f3f480ecf5
  tasks:
    - name: create ec2 instances 
      amazon.aws.ec2_instance:
        instance_type: t3.micro
        image_id: {{ image_id }}
        name: "roboshop-{{ item }}"
        security_groups: 
        - "roboshop-common"
        - "roboshop={{ item }}"
      loop: "{{ instances }}"   
      register: ec2_instance_output

    - name: print out_put
      debug:
        msg: {{ ec2_instance_output }}
